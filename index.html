<!DOCTYPE html>
<html lang="ru">
<head>

    <!-- ИКОНКА ВКЛАДКИ (FAVICON) -->
    <link rel="icon" type="image/png" href="favicon.png">
    <!-- Для сохранения на рабочий стол на iPhone -->
    <link rel="apple-touch-icon" href="favicon.png">
    
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-JWBKLHH4D0"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-JWBKLHH4D0');
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CERBOAR BAND</title>
    <style>
        /* Базовые настройки */
        body {
            background-image: url("bg.png");
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
            background-attachment: fixed;
            background-color: #0c0c0c;
            color: #ffffff;
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 20px 0;
            display: flex;
            justify-content: center;
        }

        /* Главный контейнер (по умолчанию для телефонов) */
        .container {
            width: 100%;
            max-width: 480px;
            padding: 0 20px;
            box-sizing: border-box;
            text-align: center;
            margin: 0 auto;
        }

        /* Логотип */
        .logo {
            width: 100%;
            max-width: 450px;
            margin: 0 auto 30px auto;
            display: block;
            filter: drop-shadow(0px 4px 10px rgba(0, 0, 0, 0.8));
        }

        /* Сетка для плееров */
        .media-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 30px;
        }

        .embed-section {
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            background: #1a1a1a;
            width: 100%;
        }

        /* Контейнер для правильных пропорций YouTube */
        .youtube-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* Пропорции 16:9 */
        }
        
        .youtube-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Сетка для кнопок */
        .links-grid {
            display: grid;
            grid-template-columns: 1fr; /* 1 колонка на мобильных */
            gap: 15px;
        }

        /* Кнопки-ссылки */
        .metal-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 60px;
            text-decoration: none;
            color: #e0e0e0;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-radius: 4px;
            background-image: url('metal-plate.png'); 
            background-size: cover;
            background-position: center;
            background-color: #333;
            background-blend-mode: multiply;
            border-top: 2px solid #666;
            border-bottom: 2px solid #111;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8), 0 5px 10px rgba(0,0,0,0.5);
            transition: transform 0.2s, filter 0.2s;
        }

        .metal-btn:active {
            transform: scale(0.97);
            border-top: 2px solid #111;
            border-bottom: 2px solid #666;
        }
        
        .metal-btn:hover {
            filter: brightness(1.2);
            color: #ffffff;
        }

        /* ========================================= */
        /* АДАПТАЦИЯ ДЛЯ ПК (экраны шире 768px)      */
        /* ========================================= */
        @media (min-width: 768px) {
            .container {
                max-width: 900px; /* Расширяем контейнер для десктопа */
                padding: 0 40px;
            }

            .logo {
                max-width: 600px; /* Увеличиваем логотип */
                margin-bottom: 40px;
            }

            .media-grid {
                flex-direction: row; /* Ставим плееры в один ряд */
                align-items: center; /* Центрируем их по вертикали */
                gap: 30px;
            }

            .media-grid > div {
                flex: 1; /* Заставляем плееры занимать ровно по 50% ширины */
            }

            .links-grid {
                grid-template-columns: repeat(2, 1fr); /* 2 колонки кнопок */
                gap: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- ЛОГОТИП -->
        <img src="logo.png" alt="Логотип группы" class="logo">

        <!-- БЛОК С ПЛЕЕРАМИ -->
        <div class="media-grid">
            <!-- ВСТРОЕННЫЙ SPOTIFY -->
            <div class="embed-section">
                <iframe style="border-radius:8px" src="https://open.spotify.com/embed/track/1bohpFBPKaWLpVweH2Z8AJ?utm_source=generator&si=b0ca7040e2af42be" width="100%" height="152" frameborder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
            </div>

            <!-- ВСТРОЕННЫЙ YOUTUBE -->
            <div class="embed-section youtube-container">
                <iframe src="https://www.youtube.com/embed/KyRQ8qQg3JU?si=ChklJgV8xFlspBst" title="YouTube video player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen loading="lazy"></iframe>
            </div>
        </div>

        <!-- КНОПКИ ССЫЛОК -->
        <div class="links-grid">
            <a href="SPOTIFY" class="metal-btn" target="_blank">Spotify</a>
            <a href="APPLE_MUSIC" class="metal-btn" target="_blank">Apple Music</a>
            <a href="https://www.youtube.com/@Cerboarband" class="metal-btn" target="_blank">YouTube</a>
            <a href="BANDCAMP" class="metal-btn" target="_blank">Bandcamp</a>
            <a href="https://www.facebook.com/groups/1230404839211631/" class="metal-btn" target="_blank">Facebook</a>
            <a href="https://t.me/cerboar" class="metal-btn" target="_blank">TELEGRAM</a>
            <a href="INSTAGRAM" class="metal-btn" target="_blank">Instagram</a>
            <a href="https://www.tiktok.com/@cerboar?_r=1&_t=ZN-98NekW9Pifm" class="metal-btn" target="_blank">TikTok</a>
        </div>

    </div>

</body>
</html>
