<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CERBOAR BAND</title>
    <style>
        /* Базовые настройки */
        body {
            background-color: #0c0c0c; /* Глубокий черный фон */
            color: #ffffff;
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 20px 0;
            display: flex;
            justify-content: center;
        }

        /* Главный контейнер (ограничиваем ширину для телефонов) */
        .container {
            width: 100%;
            max-width: 480px;
            padding: 0 20px;
            box-sizing: border-box;
            text-align: center;
        }

        /* Логотип */
        .logo {
            width: 80%;
            max-width: 250px;
            margin: 0 auto 30px auto;
            display: block;
            /* Если нужен легкий эффект тени для логотипа: */
            filter: drop-shadow(0px 4px 10px rgba(0, 0, 0, 0.8));
        }

        /* Встроенные плееры (Spotify / YouTube) */
        .embed-section {
            margin-bottom: 30px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            background: #1a1a1a;
        }

        /* Контейнер для правильных пропорций YouTube */
        .youtube-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* Пропорции 16:9 */
        }
        .youtube-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Кнопки-ссылки */
        .links-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .metal-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 60px;
            text-decoration: none;
            color: #e0e0e0;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-radius: 4px;
            
            /* Сюда вы вставите свою картинку металлической пластины */
            background-image: url('metal-plate.png'); 
            background-size: cover;
            background-position: center;
            
            /* Если картинка не загрузится, будет этот градиент */
            background-color: #333;
            background-blend-mode: multiply;

            /* Имитация объема (света и тени по краям) */
            border-top: 2px solid #666;
            border-bottom: 2px solid #111;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8), 0 5px 10px rgba(0,0,0,0.5);
            transition: transform 0.2s, filter 0.2s;
        }

        /* Анимация при нажатии */
        .metal-btn:active {
            transform: scale(0.97);
            border-top: 2px solid #111;
            border-bottom: 2px solid #666;
        }
        
        /* При наведении (для ПК) */
        .metal-btn:hover {
            filter: brightness(1.2);
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- ВСТАВЬТЕ СЮДА ВАШ ЛОГОТИП -->
        <img src="logo.png" alt="Логотип группы" class="logo">

        <!-- ВСТРОЕННЫЙ SPOTIFY -->
        <div class="embed-section">
            <!-- Замените ссылку в src на ваш код iframe из Spotify -->
            <iframe style="border-radius:8px" src="https://open.spotify.com/embed/track/1bohpFBPKaWLpVweH2Z8AJ?utm_source=generator&si=b0ca7040e2af42be" width="100%" height="152" frameborder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
        </div>

        <!-- ВСТРОЕННЫЙ YOUTUBE -->
        <div class="embed-section youtube-container">
            <!-- Замените ссылку в src на ваш код iframe из YouTube -->
            <iframe src="https://www.youtube.com/embed/7m7njvwB-Ks?si=q0kBWGBpfwwlCrrv" title="YouTube video player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
        </div>

        <!-- КНОПКИ ССЫЛОК -->
        <div class="links-section">
            <a href="SPOTIFY" class="metal-btn" target="_blank">Spotify</a>
            <a href="APPLE_MUSIC" class="metal-btn" target="_blank">Apple Music</a>
            <a href="YOUTUBE" class="metal-btn" target="_blank">YouTube</a>
            <a href="BANDCAMP" class="metal-btn" target="_blank">Bandcamp</a>
            <a href="INSTAGRAM" class="metal-btn" target="_blank">Instagram</a>
            <a href="https://www.tiktok.com/@cerboar?_r=1&_t=ZN-98NekW9Pifm" class="metal-btn" target="_blank">TikTok</a>
        </div>

    </div>

</body>
</html>
